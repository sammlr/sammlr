<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sammlr · Manuelle Tauschauswahl</title>
<link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/sticker_list.css"><link rel="stylesheet" href="/trade-v2/assets/manual.css">
<script type="module" src="/trade-v2/assets/manual_view.js"></script></head>
<body class="s31-product-page sticker-list-page sticker-list-glassboard-page trade-manual" data-screen="manual"><div class="sticker-list-shell">
<header class="sticker-list-header"><a class="sticker-list-logo" href="/trade-v2/" aria-label="Sammlr. Tauschen"><img class="sticker-list-wordmark" src="/static/ceoklaue-wordmark.svg" alt="sammlr."></a><br><a class="sticker-list-back" href="/trade-v2/partners/{{ data.partner.slug }}">← {{ data.partner.display_name }}</a><h1 id="manual-title"></h1></header>
<main class="sticker-list-paper" id="manual-albums"></main>
<aside class="sticker-list-tradebar is-active" aria-label="Aktueller Tausch"><div class="sticker-list-trade-head"><div class="sticker-list-trade-title"><strong id="manual-note-title" data-postit-heading></strong><img class="postit-underline" src="/static/ceoklaue-ui/underline.svg" alt=""></div><button type="button" class="sticker-list-clear" id="manual-clear">Leeren</button></div><p class="sticker-list-transfer-summary" id="manual-summary" aria-live="polite"></p><button type="button" class="sticker-list-check analog-bracket-button" id="manual-review" disabled></button></aside>
<p id="manual-status" role="status" aria-live="polite"></p><a id="manual-existing" hidden>Bestehenden Tausch ansehen →</a>
</div><script type="application/json" id="trade-data">{{ data|tojson }}</script></body></html>
