      </g>
      <g id="shield_inner_fill">
        <path d="M225 100H799C823 100 843 120 843 144V200C843 221 860 238 881 238H932C947 238 960 251 960 266V358C960 381 941 400 918 400H892C868 400 848 420 848 444V744C848 763 837 781 819 789L529 913C518 918 506 918 495 913L205 789C187 781 176 763 176 744V444C176 420 156 400 132 400H106C83 400 64 381 64 358V266C64 251 77 238 92 238H143C164 238 181 221 181 200V144C181 120 201 100 225 100Z" fill="url(#shield_surface)"/>
      </g>
      <g id="shield_inner_outline">
        <path d="M229 164H795C812 164 826 178 826 195V219C826 238 841 253 860 253H919C929 253 937 261 937 271V361C937 371 929 379 919 379H891C856 379 828 407 828 442V727C828 747 816 765 798 773L528 888C518 892 506 892 496 888L226 773C208 765 196 747 196 727V442C196 407 168 379 133 379H105C95 379 87 371 87 361V271C87 261 95 253 105 253H164C183 253 198 238 198 219V195C198 178 212 164 229 164Z" fill="none" stroke="url(#shield_inner_line)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
      <g id="shield_highlights">
        <path d="M226 100H798C822 100 842 120 842 144" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.62"/>
        <path d="M176 456V733C176 754 187 774 206 783" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.42"/>
      </g>
    </g>
    <g id="master_header_v1" transform="translate(143 124) scale(0.36)">
      <g id="header_lines" transform="translate(0 256)">
        <path id="header_line_left" class="header-line" d="M282 0H430"/>
        <path id="header_line_right" class="header-line" d="M1618 0H1766"/>
      </g>
      <g id="header_text">
        <text id="header_text_two_line_top" class="header-text" x="1024" y="190" font-size="96">VFL OSNABRÜCK</text>
        <text id="header_text_two_line_bottom" class="header-text" x="1024" y="324" font-size="126">25/26</text>
      </g>
    </g>
    <g id="album_branding_vfl" transform="translate(208 220) scale(0.65)">
      <use href="#master_logo_vfl_symbol" width="1024" height="1024"/>
    </g>
    <g id="master_logo_emboss" transform="translate(456 764) scale(0.11)" opacity="0.78">
      <g id="back_card" transform="translate(-92 -82) rotate(-8 555 535)">
        <rect x="300" y="300" width="470" height="470" rx="46" ry="46" fill="none" stroke="url(#emboss_line)" stroke-width="26"/>
      </g>
      <g id="front_card">
        <rect x="320" y="300" width="470" height="470" rx="46" ry="46" fill="none" stroke="url(#emboss_line)" stroke-width="26"/>
      </g>
      <g id="letter_s" transform="matrix(0.975 0 0 0.975 3 6)">
        <path d="M637 389C594 349 501 348 462 405C427 456 467 503 545 520C637 540 676 586 647 640C608 711 487 713 407 641" fill="none" stroke="url(#emboss_line)" stroke-width="88" stroke-linecap="round" stroke-linejoin="round" opacity="0.74"/>
      </g>
    </g>
  </g>
</svg>
