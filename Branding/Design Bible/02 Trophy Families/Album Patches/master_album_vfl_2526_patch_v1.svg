<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Master Album VfL 25/26 Patch V1</title>
  <desc id="desc">Sammlr Album-Patch fuer VfL Osnabrueck 25/26, zusammengesetzt aus Master Shield V1, Master Header V1, Master Logo VfL und Master Logo Emboss.</desc>
  <defs>
    <linearGradient id="shield_surface" x1="0.18" y1="0.04" x2="0.82" y2="0.96">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.44" stop-color="#F8F5FA"/>
      <stop offset="0.76" stop-color="#EEE8F1"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="shield_edge" x1="0.16" y1="0.06" x2="0.9" y2="0.96">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.48" stop-color="#E7E0EA"/>
      <stop offset="0.7" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFC5D9"/>
    </linearGradient>
    <linearGradient id="shield_inner_line" x1="0.2" y1="0.08" x2="0.8" y2="0.92">
      <stop offset="0" stop-color="#9B72FF"/>
      <stop offset="0.5" stop-color="#6B3DF2"/>
      <stop offset="1" stop-color="#4C1EC8"/>
    </linearGradient>
    <filter id="shield_drop_shadow" x="-12%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#160536" flood-opacity="0.32"/>
    </filter>
    <filter id="shield_soft_depth" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="-5" stdDeviation="5" flood-color="#6B3DF2" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="emboss_line" x1="0.16" y1="0.08" x2="0.86" y2="0.92">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#EDE7F2"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="vfl_panel_fill" x1="0.2" y1="0.04" x2="0.82" y2="0.96">
      <stop offset="0" stop-color="#6B3DF2"/>
      <stop offset="0.5" stop-color="#3E168D"/>
      <stop offset="1" stop-color="#1D0648"/>
    </linearGradient>
    <linearGradient id="vfl_panel_edge" x1="0.14" y1="0.04" x2="0.86" y2="0.96">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#A982FF"/>
      <stop offset="0.66" stop-color="#6B3DF2"/>
      <stop offset="1" stop-color="#1B0644"/>
    </linearGradient>
    <linearGradient id="vfl_letter_surface" x1="0.2" y1="0.08" x2="0.86" y2="0.95">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.56" stop-color="#F4EFF8"/>
      <stop offset="1" stop-color="#DED4E8"/>
    </linearGradient>
    <linearGradient id="vfl_letter_edge" x1="0.18" y1="0.06" x2="0.82" y2="0.94">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#D8CEE3"/>
      <stop offset="1" stop-color="#2B0A6B"/>
    </linearGradient>
    <filter id="vfl_branding_shadow" x="-10%" y="-8%" width="120%" height="122%">
      <feDropShadow dx="0" dy="14" stdDeviation="9" flood-color="#160536" flood-opacity="0.28"/>
    </filter>
    <filter id="vfl_letter_depth" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="7" stdDeviation="3" flood-color="#160536" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="-3" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.58"/>
    </filter>
    <style>
      .header-text {
        fill: #6B3DF2;
        font-family: Inter, "Inter ExtraBold", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 10px;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .header-line {
        fill: none;
        stroke: #6B3DF2;
        stroke-width: 12;
        stroke-linecap: square;
      }
    </style>
    <symbol id="master_logo_vfl_symbol" viewBox="0 0 1024 1024">
      <image href="../../01 Master Assets/master_logo_vfl.png" x="0" y="0" width="1024" height="1024" preserveAspectRatio="xMidYMid meet"/>
